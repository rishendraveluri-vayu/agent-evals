# Replaces the image's /etc/nginx/nginx.conf so nginx can run as the unprivileged
# `nginx` user: no `user` directive, pid and temp files in /tmp, port 8080.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Docker's embedded DNS. Resolving the API per request (through the variable
  # below) lets nginx start before the api service exists; /api/ then answers
  # 502 until it is up, and the UI shows "API unreachable". The short timeout
  # keeps that fast on networks without Docker DNS (the default bridge).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
      set $api_upstream http://api:3000;
      # With a variable and no URI part, nginx forwards the original path, e.g. /api/health.
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints everything under /assets/, so it can be cached for good. The bundle goes
    # out gzipped (about 376 KB of JS and 77 KB of CSS uncompressed), which matters on a slow line.
    # The fonts are woff2, already compressed, so their types are not listed.
    location /assets/ {
      gzip on;
      gzip_vary on;
      gzip_comp_level 6;
      gzip_min_length 1024;
      gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # SPA fallback: unknown paths get index.html, which is never cached (and is gzipped too).
    location / {
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types image/svg+xml;
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
