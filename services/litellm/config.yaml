# LiteLLM proxy config. Every model call from every harness goes through here.
#
# SP0 registers only the fake models. Real models (Haiku 5.5, Gemini Flash)
# are added in SP1, and any real call needs Rishi's sign-off first (R8).

model_list:
  # Any "fake/<script>" model goes to the fake server, which picks the
  # script from the part after the slash.
  - model_name: fake/*
    litellm_params:
      model: openai/*
      api_base: http://fake-llm:8080/v1
      api_key: fake-key-not-secret
      # Prices here as well as in model_info: for a wildcard route LiteLLM prices
      # the resolved model (openai/<script>) and ignores model_info, so without
      # these the fake's spend was logged as $0 (seen 3 Nov on v1.99.4).
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
    # Made-up prices, so spend accrues on fake calls and per-trial budget caps
    # (LiteLLM max_budget) can be tested without real money.
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002

  # Real models. Registering them costs nothing; calling them needs Rishi's
  # sign-off with an estimate (R8). Prices checked on the providers' pages on
  # 4 Nov 2026, in litellm_params as well as model_info (see the fake/* note).
  #
  # Claude Haiku 5.5, platform.claude.com/docs/en/about-claude/pricing: $0.10 in,
  # $0.50 out, $0.125 cache write (5 min), $0.01 cache read, per million tokens,
  # for prompts up to 100,000 tokens. Above that every price is 5x; LiteLLM has
  # no 100k tier, so spend on such a prompt would be under-counted (known-limits).
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
      cache_creation_input_token_cost: 0.000000125
      cache_read_input_token_cost: 0.00000001
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
      cache_creation_input_token_cost: 0.000000125
      cache_read_input_token_cost: 0.00000001

  # Claude Sonnet 5.5, platform.claude.com/docs/en/about-claude/pricing, checked 4 Nov
  # 2026: $2.00 in, $10.00 out, $2.50 cache write (5 min), $0.10 cache read (0.05x input),
  # per million tokens; no long-context tier. Used by the platform's pre-run conflict check
  # (D38), from a standing $2 allowance; not a trial model unless a config names it.
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      cache_creation_input_token_cost: 0.0000025
      cache_read_input_token_cost: 0.0000001
    model_info:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      cache_creation_input_token_cost: 0.0000025
      cache_read_input_token_cost: 0.0000001

  # Gemini 3.8 Flash, aistudio.google.com/docs/pricing (paid tier, standard):
  # $0.75 in, $3.75 out including thinking, $0.075 cache read, per million
  # tokens, through 31 Dec 2026 (then $1.50 / $7.50). No long-context tier.
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375
      cache_read_input_token_cost: 0.000000075
    model_info:
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375
      cache_read_input_token_cost: 0.000000075

litellm_settings:
  # Never on for trials: a cached reply would make repeated trials stop being
  # independent samples (CLAUDE.md). Checked in CI by scripts/check_litellm_config.py.
  cache: false
  # Fail loudly on a parameter a provider does not support, instead of
  # silently dropping it. A dropped temperature would break the settings test.
  drop_params: false

router_settings:
  # No silent retries inside the proxy, so every fault reaches the caller and
  # can be counted. SP3 decides the retry policy.
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # The database holds virtual keys and their budgets (one key per trial).
  database_url: os.environ/DATABASE_URL
  # Keep full request and response bodies in the spend log, so the runner can
  # store them per trial and the invariance diff can read the first request
  # (contract v2, sections 6 and 10).
  store_prompts_in_spend_logs: true
  # Write spend logs every second instead of every 10, so the runner can merge
  # a trial's model calls soon after the adapter exits.
  proxy_batch_write_at: 1
