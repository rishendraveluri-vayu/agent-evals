[project]
name = "fake-llm"
version = "0.1.0"
description = "Fake OpenAI-compatible chat-completions server for tests and CI: scripted replies, forced faults, request capture."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
fake-llm = "fake_llm.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openai>=3.42.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
