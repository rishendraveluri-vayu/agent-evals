# One finance tool call, then an answer that uses its result. Works for every harness: the
# tool name is matched to the request's tools (Hermes prefixes it with mcp__finance__).
description: Calls calculate_emi for Rs 10 lakh at 9% over 20 years, then answers.
steps:
  - tool_calls:
      - name: calculate_emi
        arguments: {principal: 1000000, annual_rate_pct: 9, tenure_months: 240}
  - text: "Your EMI would be about Rs 8,997 a month for 20 years, and the total interest is about Rs 11.59 lakh."
