[project]
name = "ownloop"
version = "0.1.0"
description = "The own plain tool-calling loop: the reference harness, written on the shared adapter library."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "evals-adapter",
    "mcp==2.3.0",
    "openai>=2.54.0",
]

[project.scripts]
ownloop-adapter = "ownloop.adapter:entry"

[tool.uv.sources]
evals-adapter = { path = "../adapterlib", editable = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
# The gate tests start the fake model server and the finance server from their own project
# environments (services/*/.venv), so neither is a dependency here.
dev = [
    "jsonschema>=4.25.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
