# CI: lint, tests and a compose smoke test, with no LLM spend.
# No provider keys exist here, so any accidental real call fails instead of costing money.
# Actions are pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    # The API's database tests run against a real Postgres; without TEST_DATABASE_URL they skip.
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:55432/postgres
      # The API's grading e2e test runs the real Python grader worker against the API (SP4).
      EVALS_GRADER_BIN: ${{ github.workspace }}/graders/.venv/bin/evals-grader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14"
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: The grader worker, for the grading e2e test
        working-directory: graders
        run: uv sync --locked --no-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [services/fake-llm, services/finance-mcp, workers/adapterlib, graders, stats]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: The adapter library on Python 3.11 too, since every harness imports it
        if: matrix.project == 'workers/adapterlib'
        run: uvx --python 3.11 --with jsonschema --with-editable . pytest -q

  harness-gates:
    # Contract v2 gate tests for each harness against the fake model server (R7, R10.5).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Fake model server and finance tools
        run: |
          (cd services/fake-llm && uv sync --locked)
          (cd services/finance-mcp && uv sync --locked)
      - name: Own loop
        working-directory: workers/ownloop
        run: uv sync --locked && uv run ruff check . && uv run ruff format --check . && uv run pytest -q
      - name: LangGraph
        working-directory: workers/langgraph
        run: uv sync --locked && uv run ruff check . && uv run ruff format --check . && uv run pytest -q
      - name: Google ADK
        working-directory: workers/adk
        run: uv sync --locked && uv run ruff check . && uv run ruff format --check . && uv run pytest -q
      - name: OpenAI Agents SDK
        working-directory: workers/openai-agents
        run: uv sync --locked && uv run ruff check . && uv run ruff format --check . && uv run pytest -q
      - name: Hermes at the pinned SHA, from its own lockfile
        run: scripts/setup_hermes.sh
      - name: Hermes
        working-directory: workers/hermes
        run: |
          uv sync --locked && uv run ruff check . && uv run ruff format --check .
          HERMES_SRC=$PWD/.hermes-agent uv run pytest -q

  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: LiteLLM config keeps trials faithful (no cache, no dropped params, no silent retries)
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/check_litellm_config.py
      - name: Compose gives the API and workers one token, and only the API mounts runs/
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/check_compose.py
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: The export and system-spend scripts' own tests (standard library only)
        run: |
          python3 scripts/test_export_example.py
          python3 scripts/test_log_system_spend.py

  compose-smoke:
    runs-on: ubuntu-24.04
    needs: [node, python, harness-gates, config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: python3 scripts/smoke.py
      - name: Worker isolation check (D3)
        run: docker compose --profile smoke run --rm netcheck
      - name: Crash recovery (SP3) - kill a worker mid-run; every trial done exactly once
        run: python3 scripts/sp3_kill_test.py --n 2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Harness gates through LiteLLM (trial keys, spend-log merge)
        env:
          EVALS_PROXY_URL: http://127.0.0.1:4000
          LITELLM_MASTER_KEY: sk-local-dev-only
        run: |
          (cd services/finance-mcp && uv sync --locked)
          for w in ownloop langgraph adk openai-agents; do
            (cd workers/$w && uv sync --locked && uv run pytest -q tests/test_proxy.py)
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile smoke down -v
