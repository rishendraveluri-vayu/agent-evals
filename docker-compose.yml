# One command: `docker compose up`. Defaults below work without a .env: you can look around,
# open the finished example, build and save agents, and test the platform on the fake models.
# Running an agent on a real model needs its provider key in .env, and each such run is paid.
# The project name is fixed so network and volume names do not depend on the
# folder the repo was cloned into.
name: agent-evals

# The worker token, one variable with one default for the API and every worker, so a worker is
# let in out of the box. scripts/check_compose.py checks the two still match.
x-worker-token: &worker-token ${EVALS_WORKER_TOKEN:-wt-local-dev-only}

x-worker-runtime: &worker-runtime
  # Every harness worker runs like this, so one trial cannot see or change another: a read-only
  # root, one writable trial folder, no extra privileges, and only the internal trials network.
  read_only: true
  tmpfs:
    - /trial:size=512m,uid=10001,gid=10001,mode=0700
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  networks: [trials]

x-harness-worker: &harness-worker
  # One long-lived worker per harness, one trial at a time, isolated as above. Scale a harness with
  # `--scale worker-<harness>=N`; each replica's id defaults to its hostname. No init: the worker
  # is PID 1, reaps the trial's orphans itself, and makes itself non-dumpable so a trial cannot
  # read the worker token from its environment (an init would hold a readable copy).
  <<: *worker-runtime
  restart: unless-stopped
  environment:
    # Only the worker token. The trial's LiteLLM keys arrive in each claim; LiteLLM's master key
    # and the provider keys never reach a worker.
    EVALS_API_URL: http://api:3000/api
    EVALS_WORKER_TOKEN: *worker-token
  # No volumes. The worker uploads each trial's files to the API, which alone writes runs/, so
  # no trial can read or change another trial's stored files.
  depends_on:
    api:
      condition: service_healthy
    litellm:
      condition: service_healthy

services:
  postgres:
    image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_USER: evals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evals-local}
      POSTGRES_DB: evals
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evals -d evals"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [control]

  litellm:
    image: ghcr.io/berriai/litellm:v1.99.4@sha256:475f4ae80a09d769d84c92202e70502abe52a62a760c97e598261c9c8cf8244f
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-only}
      DATABASE_URL: postgresql://evals:${POSTGRES_PASSWORD:-evals-local}@postgres:5432/litellm
      # Use the price map bundled with this pinned image, not one fetched at
      # startup, so cost numbers do not change between runs.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # LiteLLM cuts long strings out of the bodies it stores in the spend log (about 2,000
      # characters by default), which cut the task prompt out of Hermes's system prompt.
      # The stored bodies feed the trace and the invariance diff, so keep them whole.
      MAX_STRING_LENGTH_PROMPT_IN_DB: "2000000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./services/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    # control: reaches Postgres. trials: workers reach it. egress: reaches providers.
    networks: [control, trials, egress]

  fake-llm:
    build: ./services/fake-llm
    image: agent-evals/fake-llm:dev
    networks: [trials]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: agent-evals/api:dev
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://evals:${POSTGRES_PASSWORD:-evals-local}@postgres:5432/evals
      # The API alone holds the master key: it mints, budgets and revokes each trial's keys,
      # so workers never see it (docs/api-contract.md, "Who holds which secret").
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-only}
      # Workers send this as Authorization: Bearer on /api/worker/*.
      EVALS_WORKER_TOKEN: *worker-token
      # Recorded on every experiment; set it to `git rev-parse HEAD` when starting a real run.
      EVALS_PLATFORM_COMMIT: ${EVALS_PLATFORM_COMMIT:-}
      # The standing allowance, in USD, for the paid conflict checks run on Claude Sonnet 5.5
      # before a run; each check still asks first, with its cost.
      EVALS_CONFLICT_CHECK_ALLOWANCE_USD: ${EVALS_CONFLICT_CHECK_ALLOWANCE_USD:-2}
      # Whether each provider key is set in .env, so the UI can say which models cannot run before
      # a run fails. `${VAR:+1}` is 1 when the key is set and not empty, else empty: a flag, never
      # the key, which only LiteLLM holds. scripts/check_compose.py checks both.
      ANTHROPIC_KEY_SET: ${ANTHROPIC_API_KEY:+1}
      GEMINI_KEY_SET: ${GEMINI_API_KEY:+1}
      # Trial folders: the adapters' gate and smoke runs, and every experiment attempt, which the
      # API writes from the files workers upload (runs/<experiment>/<trial>/attempt-<n>/).
      # `docker compose down -v` wipes the database, not these files.
      RUNS_DIR: /runs
      # The catalogue is read from git: adapters' capabilities, prompts and tasks.
      WORKERS_DIR: /repo/workers
      CONFIGS_DIR: /repo/configs
      TASKS_DIR: /repo/tasks
      # The finance MCP server's published tool manifest and version: the toolset's sha256
      # covers both, so a tool schema change is a new toolset.
      FINANCE_MCP_DIR: /repo/services/finance-mcp
      # Human labels: the Labels screen appends a person's own judgments here; nothing else
      # writes them.
      LABELS_DIR: /repo/labels
      # The shipped example experiments, loaded when you open one from the home page.
      EXAMPLES_DIR: /repo/examples
    volumes:
      # Read-write: the API stores uploaded trial files here. The server runs as uid 1000 (node).
      # Its start-up step gives runs/, labels/ and configs/prompts/ (those folders only, never
      # their contents) to that user when it is not their owner, keeping your group and making
      # them group-writable, so you can still delete what it writes; on a host where you are uid
      # 1000 nothing changes. Its health check fails, saying which folder, when one stays unwritable.
      - ./runs:/runs
      - ./workers:/repo/workers:ro
      - ./configs:/repo/configs:ro
      # Read-write over the read-only configs/ above: saving a new prompt version on the Config
      # screen adds its file here (never overwriting one). Handled at start-up like runs/.
      - ./configs/prompts:/repo/configs/prompts
      - ./tasks:/repo/tasks:ro
      - ./services/finance-mcp:/repo/services/finance-mcp:ro
      - ./labels:/repo/labels
      # Read-only: a load copies an example's trial files into runs/, never the other way.
      - ./examples:/repo/examples:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    # control: Postgres, LiteLLM and the UI. trials: workers reach the API here.
    networks: [control, trials]

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    image: agent-evals/ui:dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:8080"
    networks: [control]

  worker-ownloop:
    <<: *harness-worker
    build:
      context: .
      dockerfile: workers/ownloop/Dockerfile
    image: agent-evals/worker-ownloop:dev

  worker-hermes:
    <<: *harness-worker
    build:
      context: .
      dockerfile: workers/hermes/Dockerfile
    image: agent-evals/worker-hermes:dev

  worker-langgraph:
    <<: *harness-worker
    build:
      context: .
      dockerfile: workers/langgraph/Dockerfile
    image: agent-evals/worker-langgraph:dev

  worker-adk:
    <<: *harness-worker
    build:
      context: .
      dockerfile: workers/adk/Dockerfile
    image: agent-evals/worker-adk:dev

  worker-openai-agents:
    <<: *harness-worker
    build:
      context: .
      dockerfile: workers/openai-agents/Dockerfile
    image: agent-evals/worker-openai-agents:dev

  # Grading is its own step after the trial. The grader claims finished trials that need grading,
  # downloads their files from the API over HTTP, runs the task's graders and reports the grades.
  # The same runtime as a harness worker (read-only root, one tmpfs, trials network only, mounts
  # nothing), so a task's unit_test grader can reach nothing but the API and LiteLLM.
  grader:
    <<: *worker-runtime
    build: ./graders
    image: agent-evals/grader:dev
    restart: unless-stopped
    environment:
      EVALS_API_URL: http://api:3000/api
      EVALS_WORKER_TOKEN: *worker-token
    depends_on:
      api:
        condition: service_healthy

  # Smoke check only: proves the worker runtime settings give exactly the access a trial is
  # meant to have. Run with `docker compose --profile smoke run --rm netcheck`.
  netcheck:
    <<: *worker-runtime
    build: ./workers/base
    image: agent-evals/worker-base:dev
    profiles: [smoke]
    depends_on:
      api:
        condition: service_healthy
      litellm:
        condition: service_healthy
      fake-llm:
        condition: service_healthy

networks:
  control: {}
  # internal: no route to the internet. Workers live only here.
  trials:
    internal: true
  egress: {}

volumes:
  pgdata: {}
