[project]
name = "evals-stats"
version = "0.1.0"
description = "Analysis for agent-evals (SP5, SP6): judge agreement with Rishi's labels, and later the A/B comparison."
# Graders and stats are Python (D1). Standard library only, so every number can be traced to a
# few lines of code and the tests pin each formula with hand-worked examples.
requires-python = ">=3.12"
dependencies = []

[project.scripts]
evals-agreement = "evals_stats.agreement_cli:main"
evals-panel = "evals_stats.panel:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
extend = "../ruff.toml"
target-version = "py312"
